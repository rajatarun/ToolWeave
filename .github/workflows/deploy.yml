name: Deploy ToolWeave

on:
  push:
    branches:
      - main
  # Pull requests run every check except the deploy, so a PR is tested
  # before it merges rather than after.
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC token issuance
  contents: read

jobs:
  # Known-vulnerable dependencies block the deploy, like a red test. Every
  # ignored advisory is listed here with the reason it does not apply.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python -m pip install pip-audit
          pip-audit -r src/requirements.txt --progress-spinner off

  # Committed credentials block the deploy, like a known-vulnerable
  # dependency. gitleaks scans the full git history, not just HEAD, because a
  # secret removed in a later commit is still published. The binary is a
  # pinned release checked against its sha256 (not gitleaks-action, which
  # needs a license key for org accounts). Every allowlisted finding is in
  # .gitleaks.toml with the reason it is not a secret.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks (full history)
        run: |
          "$RUNNER_TEMP/gitleaks" version
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .

  # Tests are a gate: deploy needs this job. Runs on pull requests too.
  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest tests/ -q

  deploy:
    needs: [test, audit, secrets]
    name: SAM Build & Deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::239571291755:role/teamweave-github-actions-sam-deployer
          aws-region: us-east-1

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          use-installer: true

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The tests ran in the test job. scripts/publish_specs.py below
      # imports toolweave, so the package is still installed here.
      - name: Install
        run: pip install -e ".[dev]"

      # ------------------------------------------------------------------
      # Validate (catches CFN/SAM syntax errors before build)
      # ------------------------------------------------------------------
      - name: SAM Validate
        run: sam validate --lint

      - name: SAM Build
        run: sam build

      # Missing CipherWeave stack or output is not fatal: /mcp then refuses
      # CipherWeave tokens and accepts only the static token, as before, and
      # says so. The legacy flag is a repository variable, so a later push
      # cannot turn it back on once the owner sets it to false.
      - name: Resolve CipherWeave token issuer
        id: cipherweave
        env:
          ACCEPT_LEGACY_TOKEN: ${{ vars.ACCEPT_LEGACY_TOKEN || 'true' }}
          CIPHERWEAVE_STACK_NAME: ${{ vars.CIPHERWEAVE_STACK_NAME || 'cipherweave-prod' }}
        run: |
          get() {
            aws cloudformation describe-stacks \
              --stack-name "$CIPHERWEAVE_STACK_NAME" \
              --region us-east-1 \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text 2>/dev/null || echo ""
          }
          JWKS_URL=$(get IssuerJwksUrl)
          ISSUER_ID=$(get IssuerId)
          if [ "$JWKS_URL" = "None" ]; then JWKS_URL=""; fi
          if [ "$ISSUER_ID" = "None" ] || [ -z "$ISSUER_ID" ]; then ISSUER_ID="urn:cipherweave:prod"; fi
          if [ -z "$JWKS_URL" ]; then
            echo "::warning::No IssuerJwksUrl on $CIPHERWEAVE_STACK_NAME. /mcp accepts only the static bearer token."
            if [ "$ACCEPT_LEGACY_TOKEN" != "true" ]; then
              echo "::error::ACCEPT_LEGACY_TOKEN is $ACCEPT_LEGACY_TOKEN and there is no JWKS URL: /mcp would accept no token at all."
              exit 1
            fi
          fi
          # Take the JWKS now, on the runner, so /mcp needs no network call to
          # verify (the function's VPC reaches the internet only through the
          # NAT instance). Public keys only. A failed download is a warning:
          # the URL is still passed, and the function fetches at runtime.
          JWKS_B64=""
          if [ -n "$JWKS_URL" ]; then
            if JWKS_BODY=$(curl -sS --fail --max-time 15 "$JWKS_URL"); then
              JWKS_MIN=$(printf '%s' "$JWKS_BODY" | jq -c '{keys: [.keys[]? | select(.kty == "EC" and .crv == "P-256" and (has("d") | not)) | {kid, kty, crv, x, y, use, alg}]}')
              if [ "$(printf '%s' "$JWKS_MIN" | jq '.keys | length')" -gt 0 ]; then
                JWKS_B64=$(printf '%s' "$JWKS_MIN" | base64 -w0)
                echo "Deploy-time JWKS: $(printf '%s' "$JWKS_MIN" | jq -r '[.keys[].kid] | join(", ")')"
              else
                echo "::warning::$JWKS_URL has no ES256 key; /mcp will fetch the JWKS at runtime."
              fi
            else
              echo "::warning::Could not download $JWKS_URL; /mcp will fetch the JWKS at runtime."
            fi
          fi
          echo "jwks_b64=$JWKS_B64" >> "$GITHUB_OUTPUT"
          echo "jwks_url=$JWKS_URL" >> "$GITHUB_OUTPUT"
          echo "issuer_id=$ISSUER_ID" >> "$GITHUB_OUTPUT"
          echo "accept_legacy=$ACCEPT_LEGACY_TOKEN" >> "$GITHUB_OUTPUT"
          echo "CipherWeave JWKS: ${JWKS_URL:-(none)}  static token accepted: $ACCEPT_LEGACY_TOKEN"

      # ------------------------------------------------------------------
      # Deploy — VPC, subnet, and observatory table values are resolved
      # inside the template via the SharedStackLookup custom resource.
      #
      # McpAuthTokenSecretName is passed on every deploy. Omitting it, or
      # passing it as an empty override, replaces the template default with
      # a blank and /mcp then rejects every caller. A repository variable
      # may rename the secret; an unset or empty variable keeps the default.
      # The token itself is not a parameter and is not in this workflow.
      # ------------------------------------------------------------------
      - name: SAM Deploy
        env:
          OBSERVATORY_SECRET_KEY: ${{ secrets.OBSERVATORY_SECRET_KEY }}
          MCP_AUTH_TOKEN_SECRET_NAME: ${{ vars.MCP_AUTH_TOKEN_SECRET_NAME || 'toolweave/mcp-auth-token' }}
          JWKS_URL: ${{ steps.cipherweave.outputs.jwks_url }}
          ISSUER_ID: ${{ steps.cipherweave.outputs.issuer_id }}
          JWKS_B64: ${{ steps.cipherweave.outputs.jwks_b64 }}
          ACCEPT_LEGACY_TOKEN: ${{ steps.cipherweave.outputs.accept_legacy }}
          TOOL_SCOPE_MODE: ${{ vars.TOOL_SCOPE_MODE || 'enforce' }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: |
          SECRET_NAME="$(printf '%s' "$MCP_AUTH_TOKEN_SECRET_NAME" | tr -d '[:space:]')"
          if [ -z "$SECRET_NAME" ]; then
            echo "::error::McpAuthTokenSecretName is blank. Refusing to deploy."
            exit 1
          fi
          case "$SECRET_NAME" in
            *[!A-Za-z0-9/_+=.@-]*)
              echo "::error::McpAuthTokenSecretName contains characters the template rejects."
              exit 1
              ;;
          esac
          echo "MCP auth secret name: ${SECRET_NAME}"

          # ObservatorySecretKey is passed only when the GitHub secret is set.
          # McpAuthTokenSecretName is always passed, and it is never empty.
          #
          # One argument per override. SAM CLI parses a single space-joined
          # string as long as every entry is Key=Value, but an empty value
          # needs the ParameterKey=,ParameterValue="" form, and a string that
          # mixes the two forms silently keeps only the ParameterKey entries.
          PARAM_OVERRIDES=("McpAuthTokenSecretName=${SECRET_NAME}")
          if [ -n "$OBSERVATORY_SECRET_KEY" ]; then
            PARAM_OVERRIDES+=("ObservatorySecretKey=\"${OBSERVATORY_SECRET_KEY}\"")
          fi
          if [ -n "$JWKS_URL" ]; then
            PARAM_OVERRIDES+=("CipherWeaveJwksUrl=${JWKS_URL}")
          else
            PARAM_OVERRIDES+=('ParameterKey=CipherWeaveJwksUrl,ParameterValue=""')
          fi
          if [ -n "$JWKS_B64" ]; then
            PARAM_OVERRIDES+=("CipherWeaveJwks=${JWKS_B64}")
          else
            PARAM_OVERRIDES+=('ParameterKey=CipherWeaveJwks,ParameterValue=""')
          fi
          PARAM_OVERRIDES+=("CipherWeaveIssuer=${ISSUER_ID:-urn:cipherweave:prod}")
          PARAM_OVERRIDES+=("AcceptLegacyToken=${ACCEPT_LEGACY_TOKEN:-true}")
          PARAM_OVERRIDES+=("ToolScopeMode=$([ "${TOOL_SCOPE_MODE}" = audit ] && echo audit || echo enforce)")
          # Ops alerts go to the repository variable ALERT_EMAIL; unset keeps
          # the topic and alarm with no subscriber.
          if [ -n "$ALERT_EMAIL" ]; then
            PARAM_OVERRIDES+=("AlertEmail=${ALERT_EMAIL}")
          else
            PARAM_OVERRIDES+=('ParameterKey=AlertEmail,ParameterValue=""')
          fi

          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${PARAM_OVERRIDES[@]}" \
            --tags repo=ToolWeave
          # repo=<RepoName> on the stack is copied onto every resource it
          # creates, so Cost Explorer splits the bill by repository; the
          # Bedrock profiles carry the same tag (ModelWeave scripts/weave_costs.py).

      # ------------------------------------------------------------------
      # Publish the API specs ToolWeave serves.
      #
      # This is what makes src/Swagger/ mean anything: the bucket is the
      # catalog's only source, and until now nothing in this repository wrote
      # to it. Each spec's server variable is substituted from the sibling
      # stack's own output, because publishing the placeholder host would give
      # the agent an API it can plan calls against and never reach.
      #
      # Not a gate: a sibling that is not deployed yet is one tool fewer, not
      # a broken ToolWeave.
      # ------------------------------------------------------------------
      - name: Publish API specs
        continue-on-error: true
        run: |
          # Read the bucket from the stack that was just deployed. No
          # fallback: a guessed bucket name is the hardcoding this stack
          # publishes an output to avoid, and a guess that is wrong uploads
          # specs where nothing reads them while reporting success.
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name toolweave \
            --region us-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='ApiSpecsBucketName'].OutputValue" \
            --output text 2>/dev/null || true)
          if [ -z "${BUCKET}" ] || [ "${BUCKET}" = "None" ]; then
            echo "::error::toolweave stack published no ApiSpecsBucketName output; cannot publish specs."
            exit 1
          fi
          echo "Publishing specs to s3://${BUCKET}"
          python scripts/publish_specs.py --bucket "${BUCKET}" --region us-east-1

      # ------------------------------------------------------------------
      # Print Function URL for easy reference
      # ------------------------------------------------------------------
      - name: Print ToolWeave API endpoint
        run: |
          URL=$(aws cloudformation describe-stacks \
            --stack-name toolweave \
            --query "Stacks[0].Outputs[?OutputKey=='ToolWeaveApiEndpoint'].OutputValue" \
            --output text)
          echo "ToolWeave MCP endpoint: ${URL}/mcp"
