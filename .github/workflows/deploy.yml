name: Deploy ToolWeave

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC token issuance
  contents: read

jobs:
  deploy:
    name: SAM Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::239571291755:role/teamweave-github-actions-sam-deployer
          aws-region: us-east-1

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------------------
      # Tests — offline, and a gate: a failing test stops the deploy.
      # ------------------------------------------------------------------
      - name: Unit tests
        run: |
          pip install -e ".[dev]"
          python -m pytest tests/ -q

      # ------------------------------------------------------------------
      # Validate (catches CFN/SAM syntax errors before build)
      # ------------------------------------------------------------------
      - name: SAM Validate
        run: sam validate --lint

      # ------------------------------------------------------------------
      # Build (native — no container needed for pure-Python deps)
      # ------------------------------------------------------------------
      - name: SAM Build
        run: sam build

      # ------------------------------------------------------------------
      # Deploy — VPC, subnet, and observatory table values are resolved
      # inside the template via the SharedStackLookup custom resource.
      # Only the observatory secret key needs an external override.
      # ------------------------------------------------------------------
      - name: SAM Deploy
        env:
          OBSERVATORY_SECRET_KEY: ${{ secrets.OBSERVATORY_SECRET_KEY }}
        run: |
          # Only pass ObservatorySecretKey when the GitHub secret is set;
          # all other parameters have defaults baked into the template.
          PARAM_OVERRIDES=""
          if [ -n "$OBSERVATORY_SECRET_KEY" ]; then
            PARAM_OVERRIDES="ObservatorySecretKey=\"$OBSERVATORY_SECRET_KEY\""
          fi

          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            ${PARAM_OVERRIDES:+--parameter-overrides "$PARAM_OVERRIDES"}

      # ------------------------------------------------------------------
      # Publish the API specs ToolWeave serves.
      #
      # This is what makes src/Swagger/ mean anything: the bucket is the
      # catalog's only source, and until now nothing in this repository wrote
      # to it. Each spec's server variable is substituted from the sibling
      # stack's own output, because publishing the placeholder host would give
      # the agent an API it can plan calls against and never reach.
      #
      # Not a gate: a sibling that is not deployed yet is one tool fewer, not
      # a broken ToolWeave.
      # ------------------------------------------------------------------
      - name: Publish API specs
        continue-on-error: true
        run: |
          # Read the bucket from the stack that was just deployed. No
          # fallback: a guessed bucket name is the hardcoding this stack
          # publishes an output to avoid, and a guess that is wrong uploads
          # specs where nothing reads them while reporting success.
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name toolweave \
            --region us-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='ApiSpecsBucketName'].OutputValue" \
            --output text 2>/dev/null || true)
          if [ -z "${BUCKET}" ] || [ "${BUCKET}" = "None" ]; then
            echo "::error::toolweave stack published no ApiSpecsBucketName output; cannot publish specs."
            exit 1
          fi
          echo "Publishing specs to s3://${BUCKET}"
          python scripts/publish_specs.py --bucket "${BUCKET}" --region us-east-1

      # ------------------------------------------------------------------
      # Print Function URL for easy reference
      # ------------------------------------------------------------------
      - name: Print ToolWeave API endpoint
        run: |
          URL=$(aws cloudformation describe-stacks \
            --stack-name toolweave \
            --query "Stacks[0].Outputs[?OutputKey=='ToolWeaveApiEndpoint'].OutputValue" \
            --output text)
          echo "ToolWeave MCP endpoint: $URL"
